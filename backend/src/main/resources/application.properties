# Render sets PORT automatically; locally it falls back to 8080
server.port=${PORT:8080}

# Defaults use an in-memory H2 database. Override with environment variables to use Oracle.
spring.datasource.url=${DB_URL:jdbc:h2:mem:notesdb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# "update" creates the table automatically (fine for learning; use migrations in real projects)
spring.jpa.hibernate.ddl-auto=update

# The frontend address that is allowed to call this API (CORS)
app.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}
